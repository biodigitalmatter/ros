launch:
  - arg:
      name: rgb1_ip
      default: "192.168.8.20"
  - arg:
      name: rgb1_user
      default: root
  - arg:
      name: rgb1_name
      default: axisaccc8e68d212
  - arg:
      name: rgb1_pw
      default: $(env RGB1_PW)
  - node:
      pkg: tf2_ros
      exec: static_transform_publisher
      name: "$(var rgb1_name)_broadcaster"
      args: >-
        --x 0 --y 0 --z 0 --roll 0 --pitch 0 --yaw 0 --frame-id map --child-frame-id $(var rgb1_name)_camera_link
  - include:
      file: "$(find-pkg-share axis_camera)/launch/axis_camera.launch"
      arg:
        - name: camera_name
          value: "$(var rgb1_name)"
        - name: hostname
          value: "$(var rgb1_ip)"
        - name: username
          value: "$(var rgb1_user)"
        - name: password
          value: "$(var rgb1_pw)"
        - name: width
          value: "1280"
        - name: height
          value: "720"
        - name: fps
          value: "25"
