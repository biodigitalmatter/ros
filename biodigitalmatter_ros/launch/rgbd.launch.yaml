launch:
  - arg:
      name: camera_model
      default: OAK-D-S2-POE
  - include:
      file: "$(find-pkg-share depthai_ros_driver)/launch/pointcloud.launch.py"
      arg:
        - name: name
          value: rgbd_camera
        - name: parent_frame
          value: tool0
        - name: cam_pos_x
          value: "0.270721"
        - name: cam_pos_y
          value: "0.072498"
        - name: cam_pos_z
          value: "0.077085"
        - name: cam_yaw
          value: "0.2617994"
          #value: "-0.2617994"
        - name: cam_pitch
          value: "0"
        - name: cam_roll
          value: "0"
        - name: camera_model
          value: $(var camera_model)
        - name: params_file
          value: "$(find-pkg-share biodigitalmatter_ros)/config/$(var camera_model).yaml"
