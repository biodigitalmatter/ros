launch:
  - arg:
      name: robot_namespace
      default: elizabeth
  - group:
      - push_ros_namespace:
          namespace: $(var robot_namespace)
      - include:
          file: $(find-pkg-share elizabeth_description)/launch/description.launch.yaml
      - node:
          pkg: joint_state_publisher
          exec: joint_state_publisher
      - node:
          pkg: tf2_ros
          exec: static_transform_publisher
          name: base_footprint_broadcaster
          args: >-
            --frame-id map --child-frame-id base_footprint
