launch:
  - arg:
      name: namespace
      default: rob1/rgbd/mounted_d405/color
  - arg:
      name: input_topic
      default: "/$(var namespace)/image_raw"
  - arg:
      name: output_topic
      default: "/$(var namespace)/image_raw/markers"
  - arg:
      name: dictionary
      default: DICT_5X5_100
      description: OpenCV ArUco dictionary name.
  - node:
      pkg: chess_vision_ros
      exec: aruco_tracker_node
      name: aruco_tracker
      namespace: $(var namespace)
      param:
        - name: dictionary
          value: $(var dictionary)
      remap:
        - from: /image_raw
          to: $(var input_topic)
        - from: /image_raw/markers
          to: $(var output_topic)
