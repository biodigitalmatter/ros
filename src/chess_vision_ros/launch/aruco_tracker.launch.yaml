launch:
  - arg:
      name: robot_namespace
      default: elizabeth
  - arg:
      name: camera_name
      default: extruder_d405
  - arg:
      name: dictionary
      default: DICT_5X5_100
      description: OpenCV ArUco dictionary name.
  - node:
      pkg: chess_vision_ros
      exec: aruco_tracker_node
      name: aruco_tracker
      namespace: $(var robot_namespace)/rgbd/$(var camera_name)/color
      param:
        - name: dictionary
          value: $(var dictionary)
