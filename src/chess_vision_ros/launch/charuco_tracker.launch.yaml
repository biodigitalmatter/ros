launch:
  - arg:
      name: namespace
      default: rob1/rgbd/extruder_d405/color
  - arg:
      name: board_name
      default: "large"
      description: "Name of ChArUco board to track"
  - arg:
      name: image_topic
      default: "mounted/color/image_raw"
      description: "Image topic"
  - arg:
      name: camera_info_topic
      default: "mounted/color/camera_info"
      description: "Camera info topic"
  - arg:
      name: rectified
      default: "false"
      description: "Set if (stereo) image topic (image_raw) is already rectified"
  - node:
      pkg: chess_vision_ros
      exec: charuco_tracker_node
      name: charuco_tracker
      namespace: $(var namespace)
      param:
        - name: board_name
          value: "$(var board_name)"
        - name: rectified
          value: "$(var rectified)"
      remap:
        - from: "/image_raw"
          to: "$(var image_topic)"
        - from: "/image_raw_markers"
          to: "$(var image_topic)_markers"
        - from: "/camera_info"
          to: "$(var camera_info_topic)"
