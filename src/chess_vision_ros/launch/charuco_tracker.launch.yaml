launch:
  - arg:
      name: namespace
      default: rob1/rgbd/extruder_d405/color
  - arg:
      name: board_name
      default: "large"
      description: "Name of ChArUco board to track"
  - arg:
      name: rectified
      default: "false"
      description: "Set if (stereo) image topic (image_raw) is already rectified"
  - node:
      pkg: chess_vision_ros
      exec: charuco_tracker_node
      name: charuco_tracker
      namespace: $(var namespace)
      param:
        - name: board_name
          value: "$(var board_name)"
        - name: rectified
          value: "$(var rectified)"
