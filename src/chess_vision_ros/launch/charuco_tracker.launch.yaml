launch:
  - arg:
      name: robot_namespace
      default: elizabeth
  - arg:
      name: camera_name
      default: extruder_d405
  - arg:
      name: board_name
      default: "large"
      description: "Name of ChArUco board to track"
  - arg:
      name: rectified
      default: "false"
      description: "Set if (stereo) image topic (image_raw) is already rectified"
  - node:
      pkg: chess_vision_ros
      exec: charuco_tracker_node
      name: charuco_tracker
      namespace: $(var robot_namespace)/rgbd/$(var camera_name)/color
      param:
        - name: board_name
          value: "$(var board_name)"
        - name: rectified
          value: "$(var rectified)"
