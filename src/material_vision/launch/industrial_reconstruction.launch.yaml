launch:
  - arg:
      name: robot_namespace
      default: elizabeth
  - arg:
      name: camera_name
      default: extruder_d405
  - include:
      file: $(find-pkg-share industrial_reconstruction)/launch/reconstruction.launch.xml
      arg:
        - name: depth_image_topic
          value: /$(var robot_namespace)/rgbd/$(var camera_name)/depth/image_rect_raw
        - name: color_image_topic
          value: /$(var robot_namespace)/rgbd/$(var camera_name)/color/image_raw
        - name: camera_info_topic
          value: /$(var robot_namespace)/rgbd/$(var camera_name)/depth/camera_info
