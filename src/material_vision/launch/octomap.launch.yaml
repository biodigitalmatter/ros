launch:
  - node:
      pkg: octomap_server
      exec: octomap_server_node
      name: octomap_server
      remap:
        - from: cloud_in
          to: /rgbd_camera/points_filtered
      param:
        - name: resolution
          value: 0.01
        - name: frame_id
          value: map
        - name: sensor_model/max_range
          value: 5.0
        - name: queue_size
          value: 100
