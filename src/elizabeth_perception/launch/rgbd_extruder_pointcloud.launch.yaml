launch:
  - arg:
      name: camera_name
      default: extruder_d405
  - group:
      - push_ros_namespace:
          namespace: /rob1/rgbd/$(var camera_name)/depth
      - node:
          pkg: elizabeth_perception_filters
          exec: depth_image_filter_node
          param:
            - name: min_distance_mm
              value: 0.02
            - name: max_distance_mm
              value: 1.20
      - node:
          pkg: depth_image_proc
          exec: point_cloud_xyz_node
          name: depth_to_pointcloud
          remap:
            - from: image_rect
              to: image_rect_filtered
          param:
            - name: queue_size
              value: 5
            # fix mismatch between depth_proc and realsense
            - name: qos_overrides./rob1/rgbd/$(var camera_name)/depth/image_rect_raw.subscription.reliability
              value: reliable
            - name: qos_overrides./rob1/rgbd/$(var camera_name)/depth/image_rect_raw.subscription.durability
              value: volatile
            - name: qos_overrides./rob1/rgbd/$(var camera_name)/depth/camera_info.subscription.reliability
              value: reliable
            - name: qos_overrides./rob1/rgbd/$(var camera_name)/depth/camera_info.subscription.durability
              value: volatile
