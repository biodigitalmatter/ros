launch:
  - arg:
      name: robot_namespace
      default: elizabeth
  - arg:
      name: camera_model
      default: d405
  - arg:
      name: camera_name
      default: extruder_$(var camera_model)
  - arg:
      name: parent_frame
      default: tool0
  - let:
      name: robot_xacro
      value: $(find-pkg-share elizabeth_perception)/urdf/$(var camera_model).urdf.xacro
  - let:
      name: robot_description
      value: "$(command '$(find-exec xacro) $(var robot_xacro) camera_name:=$(var camera_name) parent_link:=$(var parent_frame)')"
  - group:
      - push_ros_namespace:
          namespace: $(var robot_namespace)
      - push_ros_namespace:
          namespace: rgbd
      - node:
          name: $(var camera_name)_robot_state_publisher
          pkg: robot_state_publisher
          exec: robot_state_publisher
          param:
            - name: robot_description
              value: $(var robot_description)
      - node:
          pkg: realsense2_camera
          exec: realsense2_camera_node
          name: $(var camera_name)
          param:
            - from: "$(find-pkg-share elizabeth_perception)/config/rgbd_realsense_$(var camera_model).yaml"
            - name: camera_name
              value: $(var camera_name)
            - name: device_type
              value: $(var camera_model)
