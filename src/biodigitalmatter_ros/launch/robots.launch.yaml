launch:
  - arg:
      name: robot_ip
      default: 192.168.8.125
  - group:
      - push_ros_namespace:
          namespace: rob1
      - node:
          pkg: tf2_ros
          exec: static_transform_publisher
          name: base_footprint_broadcaster
          args: >-
            --frame-id map --child-frame-id base_footprint
      - include:
          file: $(find-pkg-share elizabeth_descriptions)/launch/description.launch.yaml
      - include:
          file: $(find-pkg-share abb_bringup)/launch/abb_rws_client.launch.py
          arg:
            - name: robot_ip
              value: $(var robot_ip)
          remap:
            - from: rws_client/joint_states
              to: joint_states
