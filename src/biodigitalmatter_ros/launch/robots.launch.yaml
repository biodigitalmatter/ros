launch:
  - arg:
      name: robot_ip
      default: 192.168.8.125
  - arg:
      name: rws_port
      default: "80"
  - group:
      - push_ros_namespace:
          namespace: rob1
      - node:
          pkg: tf2_ros
          exec: static_transform_publisher
          name: base_footprint_broadcaster
          args: >-
            --frame-id map --child-frame-id base_footprint
      - include:
          file: $(find-pkg-share biodigitalmatter_ros)/launch/rws.launch.yaml
          arg:
            - name: robot_ip
              value: $(var robot_ip)
            - name: rws_port
              value: $(var rws_port)
      - include:
          file: $(find-pkg-share elizabeth_descriptions)/launch/description.launch.yaml
          arg:
            # needs RWS details since they go in the xacro
            - name: rws_ip
              value: $(var robot_ip)
            - name: rws_port
              value: $(var rws_port)
