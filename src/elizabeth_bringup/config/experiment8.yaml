elizabeth:
  recorder:
    ros__parameters:
      use_sim_time: false
      record:
        topics:
          - /elizabeth/joint_states
          - /elizabeth/robot_description
          - /elizabeth/rgbd/extruder_d405/color/camera_info
          - /elizabeth/rgbd/extruder_d405/color/image_raw
          - /elizabeth/rgbd/extruder_d405/color/metadata
          - /elizabeth/rgbd/extruder_d405/depth/camera_info
          - /elizabeth/rgbd/extruder_d405/depth/image_rect_raw
          - /elizabeth/rgbd/extruder_d405/depth/metadata
          - /elizabeth/rgbd/extruder_d405/depth/points
          - /elizabeth/rgbd/extruder_d405/extrinsics/depth_to_color
          - /elizabeth/rgbd/extruder_d405/extrinsics/depth_to_depth
          - /elizabeth/rgbd/joint_states
          - /elizabeth/rgbd/robot_description
          - /tf
          - /tf_static
      storage:
        uri: /tmp/rosbags
        max_bagfile_size: 5000000000
        custom_data: ["experiment=8"]
